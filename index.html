<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides · Banco de Bogotá</title>
<link rel="icon" href="/base/assets/isotipo.svg">
<link rel="stylesheet" href="/base/colors_and_type.css">
<style>
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--carbon-50) }
  #root { height: 100% }

  #app { display: grid; grid-template-columns: 620px 1fr; height: 100vh }

  aside { display: flex; flex-direction: column; background: var(--white);
          border-right: 1px solid var(--border-default); min-height: 0 }

  header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 12px 16px;
           border-bottom: 1px solid var(--border-default) }
  header img { height: 20px; margin-right: auto }
  button { font: 500 13px/1 var(--font-body); padding: 8px 12px; border-radius: var(--r-pill);
           border: 1px solid var(--border-default); background: var(--white);
           color: var(--fg-accent); cursor: pointer }
  button:hover { background: var(--midnight-200) }
  button:disabled { opacity: .5; cursor: default }
  button.primary { background: var(--bg-interactive-primary); color: var(--white); border-color: transparent }
  button.primary:hover { background: var(--bg-interactive-primary-hover) }

  .barra { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px;
           border-bottom: 1px solid var(--border-default); background: var(--bg-subtle) }
  .barra button { padding: 6px 10px; font-size: 12px }
  select { font: 400 12px/1 var(--font-body); padding: 6px 8px; border-radius: var(--r-sm);
           border: 1px solid var(--border-default); background: var(--white);
           color: var(--fg-default); cursor: pointer; max-width: 150px }

  /* Picker de iconos */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10;
           display: grid; place-items: center; padding: 40px }
  .panel { display: flex; flex-direction: column; width: min(880px, 100%); height: min(640px, 100%);
           background: var(--white); border-radius: var(--r-lg); overflow: hidden;
           box-shadow: var(--shadow-xl) }
  .panel header { gap: 8px }
  .panel header input { flex: 1; font: 400 15px/1 var(--font-body); padding: 10px 14px;
                        border: 1px solid var(--border-default); border-radius: var(--r-pill);
                        outline: none; color: var(--fg-default) }
  .panel header input:focus { border-color: var(--border-accent) }
  .cats { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 16px;
          border-bottom: 1px solid var(--border-default) }
  .cats button { padding: 5px 10px; font-size: 11px; text-transform: capitalize }
  .cats button.on { background: var(--bg-interactive-primary); color: var(--white); border-color: transparent }
  .rejilla { flex: 1; overflow: auto; padding: 16px; display: grid; gap: 8px;
             grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)) }
  .rejilla button { display: flex; flex-direction: column; align-items: center; gap: 6px;
                    padding: 12px 6px; border-color: transparent; background: transparent }
  .rejilla button:hover { background: var(--midnight-200) }
  .rejilla img { width: 28px; height: 28px }
  .rejilla span { font-size: 10px; line-height: 1.3; color: var(--fg-muted); text-align: center;
                  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
  .panel footer { padding: 10px 16px; font: 400 11px/1 var(--font-body); color: var(--fg-disabled);
                  border-top: 1px solid var(--border-default) }
  .vacio { padding: 32px; font: 400 14px/1.5 var(--font-body); color: var(--fg-muted) }

  .ajustes { padding: 10px 14px; background: var(--bg-subtle);
             border-bottom: 1px solid var(--border-default) }
  .ajustes label { display: block; font: 600 10px/1 var(--font-body); letter-spacing: .06em;
                   text-transform: uppercase; color: var(--fg-muted); margin-bottom: 6px }
  .ajustes textarea { width: 100%; height: 96px; resize: vertical;
                      border: 1px solid var(--border-default); border-radius: var(--r-sm);
                      padding: 8px; font: 12px/1.6 ui-monospace, Menlo, monospace;
                      color: var(--fg-default); outline: none }

  /* Edición: tira de miniaturas + formulario de la diapositiva seleccionada */
  .edicion { flex: 1; min-height: 0; display: flex }

  .tira { width: 172px; flex: 0 0 auto; overflow: auto; background: var(--bg-muted);
          border-right: 1px solid var(--border-default) }
  ol.slides { list-style: none; margin: 0; padding: 10px; display: flex;
              flex-direction: column; gap: 8px }
  ol.slides li { background: var(--white); border-radius: var(--r-sm);
                 border: 2px solid transparent }
  ol.slides li.sel { border-color: var(--border-accent) }
  ol.slides li.sobre { border-color: var(--accent-help); border-style: dashed }
  .mini { display: block; padding: 0; border: 0; border-radius: 3px 3px 0 0;
          overflow: hidden; background: none; cursor: grab }
  .mini:active { cursor: grabbing }
  .cab { display: flex; align-items: center; gap: 2px; padding: 2px 4px }
  .etiqueta { flex: 1; font: 400 9px/1.2 var(--font-body); color: var(--fg-disabled);
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .acciones { display: flex; gap: 0; flex: 0 0 auto }
  .acciones button { padding: 2px 3px; font-size: 10px; line-height: 1;
                     border-color: transparent; background: none }
  .acciones button:disabled { opacity: .25 }

  /* Formulario de la diapositiva */
  .form { flex: 1; min-width: 0; overflow: auto; padding: 14px;
          display: flex; flex-direction: column; gap: 12px }
  .form-cab { display: flex; align-items: center; justify-content: space-between }
  .form-cab .num { font: 600 10px/1 var(--font-body); letter-spacing: .06em;
                   text-transform: uppercase; color: var(--fg-disabled) }
  .form-cab button { padding: 5px 9px; font-size: 11px }

  .form label { display: flex; flex-direction: column; gap: 4px;
                font: 600 10px/1 var(--font-body); letter-spacing: .05em;
                text-transform: uppercase; color: var(--fg-muted) }
  .form input, .form textarea, .form select, .crudo {
    font: 400 13px/1.5 var(--font-body); padding: 7px 9px; border-radius: var(--r-sm);
    border: 1px solid var(--border-default); color: var(--fg-default);
    outline: none; text-transform: none; letter-spacing: normal; width: 100% }
  .form input:focus, .form textarea:focus { border-color: var(--border-accent) }
  .form textarea { resize: vertical; font-family: var(--font-body) }
  .crudo { flex: 1; min-height: 300px; resize: none;
           font: 12px/1.6 ui-monospace, Menlo, monospace }

  .fila { display: flex; gap: 6px; align-items: center }
  .fila input { flex: 1 }
  .fila-final { display: flex; gap: 8px; align-items: flex-end; margin-top: 4px }
  .fila-final .crece { flex: 1 }

  /* Componentes: cada uno es una tarjeta que se puede quitar o mover */
  .region { display: flex; flex-direction: column; gap: 8px;
            padding: 8px; border: 1px dashed var(--border-default); border-radius: var(--r-md) }
  .etiqueta-region { font: 600 9px/1 var(--font-body); letter-spacing: .06em;
                     text-transform: uppercase; color: var(--fg-disabled) }
  .componente { display: flex; flex-direction: column; gap: 8px; padding: 8px;
                background: var(--white); border: 1px solid var(--border-default);
                border-radius: var(--r-sm) }
  .comp-cab { display: flex; align-items: center; justify-content: space-between }
  .comp-tipo { font: 600 10px/1 var(--font-body); letter-spacing: .05em;
               text-transform: uppercase; color: var(--fg-accent) }
  .anadir.comp { align-self: stretch; border-style: dashed; color: var(--fg-muted) }
  .menu-comp { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px;
               background: var(--bg-subtle); border-radius: var(--r-sm) }
  .menu-comp button { padding: 6px 10px; font-size: 11px }
  .menu-comp .cancelar { color: var(--fg-disabled) }
  .estado { font: 400 11px/1.4 var(--font-body); color: var(--warning-900) }

  .lista-campo { display: flex; flex-direction: column; gap: 6px }
  .etiqueta-campo { display: flex; justify-content: space-between; align-items: baseline;
                    font: 600 10px/1 var(--font-body); letter-spacing: .05em;
                    text-transform: uppercase; color: var(--fg-muted) }
  .etiqueta-campo small { font-weight: 400; text-transform: none; letter-spacing: normal;
                          color: var(--fg-disabled) }
  .item { display: flex; gap: 6px; align-items: center; padding: 6px;
          background: var(--bg-subtle); border-radius: var(--r-sm) }
  .campos-item { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px }
  .anadir { align-self: flex-start; padding: 5px 10px; font-size: 11px }

  /* Chip de icono: en un textarea solo se veía [categoria/nombre] */
  .chip { display: flex; align-items: center; gap: 1px; flex: 0 0 auto; align-self: flex-start }
  .chip button { padding: 3px; border-color: transparent; background: var(--white);
                 border-radius: var(--r-sm); line-height: 0; flex: 0 0 auto }
  .chip img { width: 20px; height: 20px; display: block }
  .chip .quitar { font-size: 9px; padding: 1px 2px; background: none; color: var(--fg-disabled);
                  border-radius: var(--r-pill) }
  button.chip.vacio { flex: 0 0 auto; align-self: flex-start; width: 28px; height: 28px;
                      padding: 0; display: grid; place-items: center; font-size: 13px;
                      border: 1px dashed var(--border-strong); border-radius: var(--r-sm);
                      background: var(--white); color: var(--fg-disabled) }

  #avisos { max-height: 30%; overflow: auto; padding: 12px 16px; font: 12px/1.5 var(--font-body);
            color: var(--warning-900); background: var(--warning-100);
            border-top: 1px solid var(--warning-500) }
  #avisos.grave { color: var(--error-900); background: var(--error-100); border-top-color: var(--error-500) }
  #avisos b { display: block; margin-bottom: 6px; letter-spacing: .06em; text-transform: uppercase; font-size: 10px }

  main { overflow: auto; padding: 24px; min-width: 0 }
  #deck { display: flex; flex-direction: column; gap: 24px; width: max-content }
  .slide { box-shadow: var(--shadow-lg); border-radius: 2px }

  /* Modo presentación */
  #app.presentando { grid-template-columns: 1fr }
  #app.presentando aside { display: none }
  #app.presentando main { padding: 0; display: grid; place-items: center; background: var(--black) }
  #app.presentando #deck { gap: 0 }
  #app.presentando .slide { display: none; box-shadow: none; border-radius: 0 }
  #app.presentando .slide.actual { display: block }

  @media print {
    @page { size: 1920px 1080px; margin: 0 }
    html, body { overflow: visible; background: #fff }
    #app { display: block }
    aside { display: none }
    main { padding: 0; overflow: visible }
    #deck { gap: 0; zoom: 1 !important }
    .slide { display: block !important; box-shadow: none; border-radius: 0; break-after: page }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
